# MultiAgentOS project MCP configuration for Codex.
# This keeps the local VYRELON MCP server as a project-scoped tool provider.
# Codex must trust this project before loading .codex/config.toml.

[mcp_servers.vyrelon]
command = "/Volumes/DevFiles/GitHubProject/MultiAgentOS/.venv/bin/multiagentos"
args = [
  "mcp",
  "serve",
  "--path",
  "/Volumes/DevFiles/GitHubProject/MultiAgentOS",
  "--allow-write",
  "--allow-process",
]
cwd = "/Volumes/DevFiles/GitHubProject/MultiAgentOS"
enabled = true
default_tools_approval_mode = "prompt"
startup_timeout_sec = 15
tool_timeout_sec = 120
