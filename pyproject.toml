[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagentos"
version = "0.2.0"
description = "Local-first, GitHub-native multi-agent orchestration foundation for VYRELON"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
multiagentos = "multiagentos.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "integrations*", "runtime*", "profiles*", "installer*", "multiagentos*"]
