[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagentos"
version = "0.4.0"
description = "Local-first, GitHub-native multi-agent orchestration with an Agent Execution Runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
chatgpt = ["openai>=1.0"]
mcp-http = ["mcp>=2.2,<3", "uvicorn>=0.30"]

[project.scripts]
multiagentos = "multiagentos.cli:main"

[tool.setuptools.packages.find]
include = ["agents*", "core*", "integrations*", "runtime*", "profiles*", "installer*", "multiagentos*"]
