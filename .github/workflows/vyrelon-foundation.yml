name: VYRELON Foundation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Verify package metadata and CLI
        run: |
          python -c "import importlib.metadata as m; assert m.version('multiagentos') == '0.4.0'"
          python -c "import multiagentos; import core; import runtime"
          multiagentos --help
      - name: Verify project bootstrap CLI
        run: |
          tmpdir="$(mktemp -d)"
          multiagentos init "$tmpdir" --component all
          test -f "$tmpdir/.multiagentos/profile.json"
      - name: Verify COSTFREE-001 acceptance path
        run: python tests/costfree_acceptance.py

  package-artifacts:
    runs-on: ubuntu-latest
    needs: [contract-tests, install-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate release artifacts
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import importlib.metadata as m; assert m.version('multiagentos') == '0.4.0'"
          python -c "import multiagentos"
          multiagentos --help
          test -f dist/multiagentos-0.4.0-py3-none-any.whl
          test -f dist/multiagentos-0.4.0.tar.gz
