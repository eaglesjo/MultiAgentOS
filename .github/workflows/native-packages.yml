name: Native package matrix

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: ubuntu
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Build native executable
        shell: bash
        run: |
          python -m PyInstaller --clean --onefile --name multiagentos packaging/native_entry.py
          ./dist/multiagentos --help || ./dist/multiagentos.exe --help
      - name: Build macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          chmod +x packaging/macos/build-pkg.sh
          ./packaging/macos/build-pkg.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" /DAPP_VERSION=${{ steps.version.outputs.version }} packaging/windows/installer.nsi
      - name: Build Ubuntu package
        if: matrix.platform == 'ubuntu'
        shell: bash
        run: |
          chmod +x packaging/ubuntu/build-deb.sh
          ./packaging/ubuntu/build-deb.sh "${{ steps.version.outputs.version }}"
          dpkg-deb --info dist/MultiAgentOS-${{ steps.version.outputs.version }}-ubuntu-amd64.deb
      - name: Upload native artifact
        uses: actions/upload-artifact@v6
        with:
          name: MultiAgentOS-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/MultiAgentOS-*
            dist/multiagentos*
