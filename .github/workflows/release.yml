name: Release MultiAgentOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate tag matches package version
        run: |
          test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: ubuntu
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build native executable
        run: python -m PyInstaller --clean --onefile --name multiagentos packaging/native_entry.py
      - name: Smoke test native executable
        shell: bash
        run: |
          ./dist/multiagentos --help || ./dist/multiagentos.exe --help
      - name: Build macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          chmod +x packaging/macos/build-pkg.sh
          ./packaging/macos/build-pkg.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" /DAPP_VERSION=${{ steps.version.outputs.version }} packaging/windows/installer.nsi
      - name: Build Ubuntu package
        if: matrix.platform == 'ubuntu'
        shell: bash
        run: |
          chmod +x packaging/ubuntu/build-deb.sh
          ./packaging/ubuntu/build-deb.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/MultiAgentOS-*

  pypi:
    needs: python-distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/multiagentos
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: [python-distributions, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: "*"
          path: dist/
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
