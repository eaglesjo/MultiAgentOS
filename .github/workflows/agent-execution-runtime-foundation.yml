name: Agent Execution Runtime Foundation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-inspector-streamable-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install package and MCP HTTP dependencies
        run: python -m pip install -e ".[mcp-http]"
      - name: Start Streamable HTTP server
        run: |
          nohup python -m multiagentos.cli mcp serve-http --path "$PWD" --host 127.0.0.1 --port 8000 > /tmp/mcp-http.log 2>&1 &
          echo $! > /tmp/mcp-http.pid
          python - <<'PY'
          import socket, time
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=0.5):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(0.2)
          raise SystemExit("Streamable HTTP server did not start")
          PY
      - name: Inspect tools through official MCP Inspector
        run: bash tests/mcp_inspector_http_smoke.sh
      - name: Stop Streamable HTTP server
        if: always()
        run: |
          if test -f /tmp/mcp-http.pid; then kill "$(cat /tmp/mcp-http.pid)" || true; fi
          cat /tmp/mcp-http.log || true

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install MCP SDK compatibility dependency
        run: python -m pip install ".[mcp-http]"
      - run: python -m unittest discover -s tests -v

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Verify package metadata and CLI
        run: |
          python -c "import importlib.metadata as m, tomllib; assert m.version('multiagentos') == tomllib.load(open('pyproject.toml', 'rb'))['project']['version']"
          python -c "import multiagentos; import core; import runtime"
          multiagentos --help
      - name: Verify project bootstrap CLI
        run: |
          tmpdir="$(mktemp -d)"
          multiagentos init "$tmpdir" --component all --approve
          test -f "$tmpdir/.multiagentos/profile.json"

  package-artifacts:
    runs-on: ubuntu-latest
    needs: [contract-tests, install-smoke]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate release artifacts
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import importlib.metadata as m, tomllib; assert m.version('multiagentos') == tomllib.load(open('pyproject.toml', 'rb'))['project']['version']"
          python -c "import multiagentos"
          multiagentos --help
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert Path(f"dist/multiagentos-{version}-py3-none-any.whl").exists()
          assert Path(f"dist/multiagentos-{version}.tar.gz").exists()
          PY
